[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndis-plan-guard-ml"
version = "0.5.0"
description = "NDIS Plan Guard AI Phase 4 synthetic claim risk decision-support service"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
