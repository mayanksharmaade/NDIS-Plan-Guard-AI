<div class="auth-page">
  <section class="auth-panel">
    <div class="eyebrow">NDIS PLAN GUARD</div>
    <h1>Welcome back</h1>
    <p class="lead">Sign in to manage registrations, participants and claims.</p>

    @if (error()) { <div class="alert alert-error">{{ error() }}</div> }

    <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
      <label>Email<input type="email" formControlName="email" autocomplete="email" /></label>
      <label>Password<input type="password" formControlName="password" autocomplete="current-password" /></label>
      <button class="btn btn-primary btn-wide" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-link">New service provider? <a routerLink="/register">Register here</a></p>
  </section>
</div>
